name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with: { java-version: '17', distribution: 'temurin' }
    - uses: subosito/flutter-action@v2
      with: { channel: 'stable' }
    - name: Build
      run: |
        mkdir -p lib assets
        cp main.dart lib/main.dart
        cp icons/logo.png assets/logo.png
        cp MainActivity.kt android/app/src/main/kotlin/com/dsh/dshapp/MainActivity.kt
        for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
          test -f "icons/ic_launcher-$d.png" || { echo "missing icons/ic_launcher-$d.png"; exit 1; }
          cp "icons/ic_launcher-$d.png" "android/app/src/main/res/mipmap-$d/ic_launcher.png"
        done
        python3 - <<'PY'
        import re
        from pathlib import Path
        p = Path("android/gradle/wrapper/gradle-wrapper.properties")
        s = p.read_text()
        s = re.sub(r"https://github\.com/gradle/gradle-distributions/releases/download/v[0-9.]+/", "https://services.gradle.org/distributions/", s)
        p.write_text(s)
        print(s)
        PY
        flutter pub get
        n=0
        until [ $n -ge 3 ]; do
          flutter build apk --release --target-platform android-arm64 && break
          n=$((n+1))
          echo "build failed, retry $n"
          sleep 15
        done
        test -f build/app/outputs/flutter-apk/app-release.apk
    - uses: actions/upload-artifact@v4
      with:
        name: Final-APK
        path: build/app/outputs/flutter-apk/app-release.apk
