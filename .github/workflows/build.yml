name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with: { java-version: '17', distribution: 'temurin' }
    - uses: subosito/flutter-action@v2
      with: { channel: 'stable' }
    - name: Compile
      run: |
        flutter create --platforms android --project-name dshapp --org com.dsh build_app
        cp main.dart build_app/lib/main.dart
        cp pubspec.yaml build_app/pubspec.yaml
        mkdir -p build_app/android/app/src/main/kotlin/com/dsh/dshapp
        cp MainActivity.kt build_app/android/app/src/main/kotlin/com/dsh/dshapp/MainActivity.kt
        mkdir -p build_app/assets
        cp logo.png build_app/assets/logo.png
        cd build_app
        # ---- 国内镜像：Gradle 发行版 + Maven 依赖，避免 GitHub 下载 504 卡死构建 ----
        VER=$(grep -oE 'gradle-[0-9.]+-all\.zip' android/gradle/wrapper/gradle-wrapper.properties | head -1 | sed -E 's/gradle-(.*)-all\.zip/\1/')
        echo "Gradle version: $VER"
        if [ -n "$VER" ]; then
          sed -i -E "s#^distributionUrl=.*#distributionUrl=https\\://mirrors.cloud.tencent.com/gradle/gradle-${VER}-all.zip#" android/gradle/wrapper/gradle-wrapper.properties
        fi
        grep distributionUrl android/gradle/wrapper/gradle-wrapper.properties
        python3 - <<'PY'
        def mirror_lines(kts):
            urls = [
                "https://maven.aliyun.com/repository/gradle-plugin",
                "https://maven.aliyun.com/repository/public",
                "https://maven.aliyun.com/repository/google",
            ]
            if kts:
                return "".join('            maven { url = uri("%s") }\n' % u for u in urls)
            return "".join('            maven { url "%s" }\n' % u for u in urls)

        for p in [
            "android/settings.gradle.kts",
            "android/settings.gradle",
            "android/build.gradle.kts",
            "android/build.gradle",
            "android/app/build.gradle.kts",
            "android/app/build.gradle",
        ]:
            try:
                s = open(p, encoding="utf-8").read()
            except FileNotFoundError:
                continue
            lines = mirror_lines(p.endswith(".kts")).rstrip("\n")
            s = s.replace("repositories {", "repositories {\n" + lines)
            open(p, "w", encoding="utf-8").write(s)
            print("mirror patched", p)
        PY
        # 用 logo.png 生成桌面图标（沙箱里通常自带 ImageMagick，没有就跳过）
        if command -v convert >/dev/null 2>&1; then
          for spec in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${spec%%:*}; sz=${spec##*:}
            mkdir -p android/app/src/main/res/mipmap-$d
            convert assets/logo.png -resize ${sz}x${sz} android/app/src/main/res/mipmap-$d/ic_launcher.png
          done
        fi
        # 不再覆盖 Flutter 生成的 AndroidManifest（覆盖会丢 flutterEmbedding 和启动 Activity，
        # 直接报 "deleted Android v1 embedding"）。改成只往里补前台服务和权限。
        python3 - <<'PY'
        import re
        p = "android/app/src/main/AndroidManifest.xml"
        s = open(p, encoding="utf-8").read()
        s = s.replace('<application',
                      '<application\n        android:usesCleartextTraffic="true"\n        android:largeHeap="true"', 1)
        s = re.sub(r'android:label="[^"]*"', 'android:label="原生DSH"', s, count=1)
        perms = ('    <uses-permission android:name="android.permission.INTERNET" />\n'
                 '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n'
                 '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n'
                 '    <uses-permission android:name="android.permission.WAKE_LOCK" />\n'
                 '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />\n'
                 '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n')
        s = s.replace('<application', perms + '    <application', 1)
        svc = ('        <service\n'
               '            android:name="com.dsh.dshapp.DownloadService"\n'
               '            android:exported="false"\n'
               '            android:foregroundServiceType="dataSync" />\n')
        s = s.replace('</application>', svc + '    </application>', 1)
        open(p, "w", encoding="utf-8").write(s)
        PY
        python3 -c "import xml.dom.minidom; xml.dom.minidom.parse('android/app/src/main/AndroidManifest.xml'); print('manifest ok')"
        sed -i -E 's/targetSdk *= *flutter\.targetSdkVersion/targetSdk = 28/' android/app/build.gradle.kts
        grep -q "targetSdk = 28" android/app/build.gradle.kts || { echo "targetSdk 补丁没生效"; exit 1; }
        printf '\nandroid {\n    lint {\n        abortOnError = false\n        checkReleaseBuilds = false\n    }\n}\n' >> android/app/build.gradle.kts
        flutter pub get
        flutter build apk --release --target-platform android-arm64
    - uses: actions/upload-artifact@v4
      with:
        name: Final-APK
        path: build_app/build/app/outputs/flutter-apk/app-release.apk
