name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with: { java-version: '17', distribution: 'temurin' }
    - uses: subosito/flutter-action@v2
      with: { channel: 'stable' }
    - name: Compile
      run: |
        flutter create --platforms android --project-name dshapp --org com.dsh build_app
        cp main.dart build_app/lib/main.dart
        cp pubspec.yaml build_app/pubspec.yaml
        cp AndroidManifest.xml build_app/android/app/src/main/AndroidManifest.xml
        mkdir -p build_app/android/app/src/main/kotlin/com/dsh/dshapp
        cp MainActivity.kt build_app/android/app/src/main/kotlin/com/dsh/dshapp/MainActivity.kt
        mkdir -p build_app/assets
        cp logo.png build_app/assets/logo.png
        cd build_app
        # Android 10+ 对 targetSdk>=29 的应用禁止执行私有目录里的文件，
        # 而 node 是解压到 filesDir 再直接执行的（Termux 也是降到 28 才能跑）。
        sed -i -E 's/targetSdk *= *flutter\.targetSdkVersion/targetSdk = 28/' android/app/build.gradle.kts
        # 但 AGP 的 lint 规则认为 targetSdk<33 是致命错误（ExpiredTargetSdkVersion），
        # 会把构建直接判死，所以这里把 release 的 lint 关掉。
        printf '\nandroid {\n    lint {\n        abortOnError = false\n        checkReleaseBuilds = false\n    }\n}\n' >> android/app/build.gradle.kts
        flutter pub get
        flutter build apk --release --target-platform android-arm64
    - uses: actions/upload-artifact@v4
      with:
        name: Final-APK
        path: build_app/build/app/outputs/flutter-apk/app-release.apk
